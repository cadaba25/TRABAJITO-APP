# Stack de Trabajito (backend + base de datos).
#
# Uso rápido:
#   cp .env.example .env      # y ajusta valores (JWT_SECRET es OBLIGATORIO)
#   docker compose up -d      # levanta db + api
#
# Solo la base de datos (desarrollo con el backend desde el IDE):
#   docker compose up -d db
#
# Ver docs/development.md para el detalle de despliegue en un servidor.
services:
  # ── Base de datos PostgreSQL ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: trabajito-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trabajito}
      POSTGRES_USER: ${DB_USER:-trabajito}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trabajito}
    ports:
      # Por defecto la BD solo se expone al propio host (para el IDE o psql).
      # En un servidor NO la publiques en 0.0.0.0: el backend la alcanza por
      # la red interna de Docker, no necesita el puerto publicado.
      - "${DB_PORT_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - trabajito_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trabajito} -d ${DB_NAME:-trabajito}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Spring Boot ───────────────────────────────────
  api:
    build: .
    image: trabajito-api:local
    container_name: trabajito-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de Docker el host de la BD es el nombre del
      # servicio ('db'), NO localhost.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-trabajito}
      DB_USER: ${DB_USER:-trabajito}
      DB_PASSWORD: ${DB_PASSWORD:-trabajito}
      # Obligatorio: sin secreto real cualquiera puede falsificar tokens.
      # Genéralo con: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET; copia .env.example a .env y genera uno con 'openssl rand -base64 48'}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Administrador inicial (ADR-0005): sin AMBAS variables no se crea
      # ningun ADMIN. El registro publico no puede crearlos.
      ADMIN_INICIAL_CORREO: ${ADMIN_INICIAL_CORREO:-}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-}
      # Ruta DENTRO del contenedor; debe coincidir con el volumen de abajo.
      UPLOADS_DIR: /app/uploads
    ports:
      - "${API_PORT_BIND:-8080}:8080"
    volumes:
      - trabajito_uploads:/app/uploads
    healthcheck:
      # /v3/api-docs es público (ver SecurityConfig) y solo responde cuando
      # el contexto de Spring terminó de arrancar.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v3/api-docs || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── pgAdmin (opcional, para ver la BD en el navegador) ────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trabajito-pgadmin
    restart: unless-stopped
    profiles: ["tools"]   # solo arranca con: docker compose --profile tools up
    environment:
      # OJO: pgAdmin valida este correo y RECHAZA dominios reservados como
      # `.local` (entra en bucle de reinicio con "does not appear to be a
      # valid email address"). Usa un TLD normal aunque no exista de verdad.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trabajito.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db

volumes:
  trabajito_pgdata:
  trabajito_uploads:
