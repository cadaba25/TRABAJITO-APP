name: trabajito
description: Aplicación de búsqueda de trabajos y servicios
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  # ── Migración a backend propio (ADR-0009, tarea 018) ──────────
  # Cliente HTTP para hablar con /api/**. Se eligió `http` (el paquete
  # oficial del equipo de Dart) en vez de `dio`: `ApiClient` ya resuelve a
  # mano lo único que dio aportaría (interceptores, reintento, timeouts), y
  # `dio` arrastra más superficie de la que este proyecto necesita.
  http: ^1.6.0
  # Guarda el refresh token cifrado (Keychain en iOS, clave del Android
  # Keystore en Android). Ese token ES la sesión durante 30 días, así que no
  # puede vivir en `shared_preferences`, que escribe XML en claro.
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Usados solo en test/pantalla_inicial_test.dart para reemplazar
  # FirebaseAuthPlatform.instance por un fake y evitar que
  # Firebase.initializeApp() hable con un canal de plataforma real. Ya eran
  # dependencias transitivas de firebase_auth/firebase_core; se declaran
  # explícitas para no depender de un paquete no declarado directamente
  # (lint depend_on_referenced_packages) y fijar la versión que se probó.
  firebase_auth_platform_interface: ^7.3.0
  firebase_core_platform_interface: ^5.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Sora va EMPAQUETADA, no descargada en caliente.
  # Antes se usaba el paquete google_fonts, que la baja de fonts.gstatic.com la
  # primera vez que arranca la app. Sin internet (o con una red lenta o
  # filtrada) eso lanza una excepción no capturada y la app se queda EN BLANCO:
  # comprobado en el emulador, la pantalla salía vacía. Un fallo así en una
  # demo sería catastrófico y no depende de nosotros.
  # Es un archivo de fuente variable: un solo .ttf cubre de Thin a ExtraBold,
  # así que los pesos 400/600/700/800 que usa la app salen de aquí.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
