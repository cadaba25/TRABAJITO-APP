name: trabajito
description: Aplicación de búsqueda de trabajos y servicios
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Usados solo en test/pantalla_inicial_test.dart para reemplazar
  # FirebaseAuthPlatform.instance por un fake y evitar que
  # Firebase.initializeApp() hable con un canal de plataforma real. Ya eran
  # dependencias transitivas de firebase_auth/firebase_core; se declaran
  # explícitas para no depender de un paquete no declarado directamente
  # (lint depend_on_referenced_packages) y fijar la versión que se probó.
  firebase_auth_platform_interface: ^7.3.0
  firebase_core_platform_interface: ^5.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
