server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: trabajito-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trabajito}
    username: ${DB_USER:trabajito}
    password: ${DB_PASSWORD:trabajito}

  jpa:
    hibernate:
      # 'update' es cómodo para desarrollo. En producción usa Flyway/Liquibase
      # y pon esto en 'validate'.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      # Límite de subida de archivos (evidencias / fotos).
      max-file-size: 10MB
      max-request-size: 12MB

# ── Configuración propia de Trabajito ──────────────────────────
trabajito:
  jwt:
    # IMPORTANTE: cambia este secreto en producción (mínimo 32 bytes).
    # Genera uno con: openssl rand -base64 48
    secret: ${JWT_SECRET:cambia-esto-por-un-secreto-largo-y-aleatorio-de-al-menos-32-bytes}
    # Vida del token de ACCESO (ADR-0010). Antes eran 7 días y no se podía
    # revocar; ahora es corto y la sesión la mantiene el refresh token, que sí
    # se revoca. Se acepta el nombre viejo JWT_EXPIRATION_MS como respaldo.
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:${JWT_EXPIRATION_MS:900000}}
    # Vida del refresh token (30 días). Es revocable: logout lo invalida.
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  login:
    # Freno de fuerza bruta (ADR-0010). Ventana deslizante en minutos.
    ventana-minutos: ${LOGIN_VENTANA_MINUTOS:15}
    # Tope DURO por IP: al superarlo se responde 429 sin ejecutar BCrypt.
    max-por-ip: ${LOGIN_MAX_POR_IP:20}
    # Fricción por cuenta: al superarlo, los intentos con contraseña
    # INCORRECTA responden 429. La contraseña correcta sigue entrando siempre
    # (por eso esto no sirve para dejar fuera a un usuario legítimo).
    max-por-cuenta: ${LOGIN_MAX_POR_CUENTA:5}
    # X-Forwarded-For es falsificable: solo se lee si delante hay un proxy
    # inverso de confianza que la sobrescriba.
    confiar-en-forwarded-for: ${LOGIN_CONFIAR_EN_XFF:false}
  cors:
    # Orígenes permitidos (la app Flutter en web/dev). '*' solo para desarrollo.
    allowed-origins: ${CORS_ORIGINS:*}
  admin-inicial:
    # Aprovisionamiento del ADMIN inicial (ADR-0005). Vacío por defecto: sin
    # AMBAS variables no se crea ningún administrador, en ningún perfil.
    # El registro público NO puede crear ADMIN. Ver AdminInicialSeeder.
    correo: ${ADMIN_INICIAL_CORREO:}
    password: ${ADMIN_INICIAL_PASSWORD:}
  uploads:
    # Carpeta local donde se guardan los archivos (fotos, CV, evidencias).
    # En la BD solo se guarda la ruta, nunca el binario.
    dir: ${UPLOADS_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    com.trabajito: DEBUG
