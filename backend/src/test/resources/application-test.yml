# Configuración usada solo cuando corren los tests (perfil "test",
# activado vía @ActiveProfiles("test") en TrabajitoApplicationTests).
#
# Usa H2 en memoria en vez de Postgres real para que `mvn test` no dependa
# de Docker/Postgres corriendo en la máquina que ejecuta los tests. Ver
# docs/agent-reports/003-tests-base-backend.md para la justificación de esta
# decisión (mocks para tests de servicio, H2 solo para el test de contexto).
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:trabajito-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

trabajito:
  jwt:
    secret: secreto-de-pruebas-no-usar-en-produccion-1234567890
    expiration-ms: 3600000
  cors:
    allowed-origins: "*"
  uploads:
    dir: ./build-test-uploads
